<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Vida já Começou</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #f7f0ee 0%, #f2e9e4 100%);
      color: #1E4D63;
      font-family: 'Outfit', sans-serif;
    }

    .coming-soon-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 3rem 1.5rem;
    }

    .coming-soon-card {
      max-width: 760px;
      width: 100%;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(30, 77, 99, 0.08);
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(30, 77, 99, 0.08);
      padding: 3rem 2rem;
      text-align: center;
    }

    .coming-soon-card .section-label {
      color: #FF6B35;
      margin-bottom: 1rem;
    }

    .coming-soon-card h1 {
      font-size: clamp(2.2rem, 5vw, 4rem);
      color: #1E4D63;
      margin-bottom: 1rem;
    }

    .coming-soon-card p {
      font-size: 1.08rem;
      line-height: 1.8;
      color: #2B4552;
      margin-bottom: 2rem;
    }

    .coming-soon-actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <main class="coming-soon-page">
    <div class="coming-soon-card">
      <span class="section-label">A VIDA JÁ COMEÇOU</span>
      <h1>Em construção</h1>
      <p>
        Esta página representa a jornada que será lançada em breve. A experiência digital interativa está sendo criada para acolher mulheres que querem transformar a direção da vida com mais leveza, propósito e coragem.
      </p>

      <div class="coming-soon-actions">
        <a href="index.html" class="btn-desbrava btn-orange">Voltar para a página inicial</a>
      </div>
    </div>
  </main>
</body>
</html>
